<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('journas-appearance') || '{}'); } catch { /* Storage can be disabled. */ }
      try {
        const theme = ['light', 'dark', 'system'].includes(saved?.theme) ? saved.theme : 'system';
        document.documentElement.dataset.theme = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(saved?.accent)) { const neutral = document.documentElement.dataset.theme === 'dark' && ['#292637','#000000','#000','#000000ff'].includes(saved.accent.toLowerCase()); document.documentElement.style.setProperty('--accent', neutral ? '#ffffff' : saved.accent); document.documentElement.style.setProperty('--accent-ink', neutral ? '#17151f' : '#ffffff'); }
      } catch { /* Storage can be disabled. */ }
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#7c5ce7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Journas brings your places, daily schedule, and shared travel tasks together."
    />
    <title>Journas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
